<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerial Equipment | SwipeIron</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .equipment-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .equipment-card:hover { transform: translateY(-4px); }
        .filter-btn.active {
            background-color: #f97316;
            color: white;
            border-color: #f97316;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <!-- NAV -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#f97316] rounded flex items-center justify-center text-white font-bold text-xl">S</div>
                <div>
                    <div class="font-semibold text-2xl tracking-tighter">SwipeIron</div>
                    <div class="text-[10px] text-slate-500 -mt-1">Swipe. Compare. Decide.</div>
                </div>
            </div>
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="hover:text-[#f97316]">Home</a>
                <a href="brands.html" class="hover:text-[#f97316]">Brands</a>
                <a href="construction.html" class="hover:text-[#f97316]">Construction</a>
                <a href="aerial.html" class="text-[#f97316] font-semibold">Aerial</a>
                <a href="models.html" class="hover:text-[#f97316]">All Models</a>
                <a href="compare.html" class="hover:text-[#f97316] font-semibold">Compare</a>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-end justify-between">
            <div>
                <h1 class="text-5xl font-bold tracking-tighter">Aerial Equipment</h1>
                <p class="text-xl text-slate-400 mt-1">Scissor Lifts, Boom Lifts, Telehandlers &amp; more</p>
            </div>

            <!-- Unit Toggle -->
            <div class="flex items-center bg-slate-900 rounded-2xl p-1 border border-slate-800">
                <button onclick="setUnit('us')" id="btn-us"
                        class="px-5 py-2 rounded-xl text-sm font-medium bg-slate-700 text-white">Imperial (US)</button>
                <button onclick="setUnit('metric')" id="btn-metric"
                        class="px-5 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white">Metric</button>
            </div>
        </div>

        <!-- Dynamic Subcategory Filters -->
        <div id="filter-container" class="flex flex-wrap gap-2 mt-6">
            <!-- Populated dynamically by JavaScript -->
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 mb-4 flex items-center justify-between">
        <div id="results-count" class="text-sm text-slate-400"></div>
        <button onclick="resetFilters()" 
                class="text-sm text-orange-400 hover:text-orange-300 flex items-center gap-2">
            <i class="fa-solid fa-times"></i> Clear Filters
        </button>
    </div>

    <!-- EQUIPMENT GRID -->
    <div class="max-w-7xl mx-auto px-6 pb-12">
        <div id="equipment-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kffjahvpapxekbjfhinm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmZmphaHZwYXB4ZWtiamZoaW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NjUxMDMsImV4cCI6MjA4OTQ0MTEwM30.EZkCFq0y6Mr9Rt5rn51khbif4aK_cd6ACE-6qw9MZgU';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let equipmentDatabase = [];
        let filteredData = [];
        let currentFilter = null;
        let currentUnit = 'us';

        async function loadAerialEquipment() {
            const grid = document.getElementById('equipment-grid');
            const countEl = document.getElementById('results-count');

            grid.innerHTML = '';
            countEl.innerHTML = 'Loading aerial equipment...';

            try {
                const { data, error } = await supabaseClient
                    .from('equipment_models')
                    .select('*')
                    .eq('category', 'Aerial')
                    .order('brand', { ascending: true });

                if (error) throw error;

                equipmentDatabase = data || [];
                filteredData = [...equipmentDatabase];

                renderFilters();
                renderEquipmentCards();
                updateResultsCount();

            } catch (err) {
                grid.innerHTML = `<div class="text-red-400">Failed to load data.</div>`;
            }
        }

        // ==================== DYNAMIC FILTERS ====================
        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = '';

            // Get unique subcategories
            const subcategories = [...new Set(equipmentDatabase.map(m => m.subcategory).filter(Boolean))];

            // "All" button
            const allBtn = document.createElement('button');
            allBtn.className = `filter-btn px-4 py-2 rounded-full text-sm border border-slate-700 hover:bg-slate-800 transition-all active`;
            allBtn.textContent = 'All Aerial';
            allBtn.onclick = () => {
                currentFilter = null;
                filteredData = [...equipmentDatabase];
                updateActiveFilter(allBtn);
                renderEquipmentCards();
                updateResultsCount();
            };
            container.appendChild(allBtn);

            // Dynamic subcategory buttons
            subcategories.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `filter-btn px-4 py-2 rounded-full text-sm border border-slate-700 hover:bg-slate-800 transition-all`;
                btn.textContent = sub;
                btn.onclick = () => {
                    currentFilter = sub;
                    filteredData = equipmentDatabase.filter(m => m.subcategory === sub);
                    updateActiveFilter(btn);
                    renderEquipmentCards();
                    updateResultsCount();
                };
                container.appendChild(btn);
            });
        }

        function updateActiveFilter(activeBtn) {
            document.querySelectorAll('#filter-container .filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[#f97316]', 'text-white', 'border-[#f97316]');
                btn.classList.add('border-slate-700');
            });
            activeBtn.classList.add('active', 'bg-[#f97316]', 'text-white', 'border-[#f97316]');
        }

        function resetFilters() {
            currentFilter = null;
            filteredData = [...equipmentDatabase];
            document.querySelectorAll('#filter-container .filter-btn').forEach(btn => btn.classList.remove('active', 'bg-[#f97316]', 'text-white', 'border-[#f97316]'));
            // Re-activate "All" button
            const allBtn = document.querySelector('#filter-container .filter-btn');
            if (allBtn) allBtn.classList.add('active', 'bg-[#f97316]', 'text-white', 'border-[#f97316]');
            renderEquipmentCards();
            updateResultsCount();
        }

        function updateResultsCount() {
            const countEl = document.getElementById('results-count');
            countEl.innerHTML = `${filteredData.length} machines shown`;
        }

        // ==================== RENDER CARDS ====================
        function renderEquipmentCards() {
            const container = document.getElementById('equipment-grid');
            container.innerHTML = '';

            filteredData.forEach(model => {
                const specs = model.specs || {};
                const subcategory = model.subcategory || '';

                const isScissorOrBoom = subcategory.includes('Scissor') || subcategory.includes('Boom');
                const isTelehandler = subcategory.includes('Telehandler');

                let weight = specs.operating_weight_lbs || 0;
                let platformHeight = specs.platform_height_elevated_ft || specs.platform_height_ft || 0;
                let capacity = specs.platform_capacity_lbs || specs.rated_capacity_lbs || 0;
                let liftHeight = specs.max_lift_height_ft || 0;

                if (currentUnit === 'metric') {
                    weight = Math.round(weight * 0.4536);
                    platformHeight = platformHeight > 0 ? (platformHeight * 0.3048).toFixed(1) : 0;
                    capacity = Math.round(capacity * 0.4536);
                    liftHeight = liftHeight > 0 ? (liftHeight * 0.3048).toFixed(1) : 0;
                }

                const card = document.createElement('div');
                card.className = `equipment-card bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-3xl p-6 cursor-pointer`;
                card.onclick = () => showModelDetail(model.id);

                let statsHTML = '';

                if (isScissorOrBoom) {
                    statsHTML = `
                        <div class="grid grid-cols-3 gap-4 text-center mt-6">
                            <div><div class="text-xs text-slate-500">Platform Height</div><div class="text-2xl font-bold text-[#f97316]">${platformHeight}</div></div>
                            <div><div class="text-xs text-slate-500">Capacity</div><div class="text-2xl font-bold text-[#f97316]">${capacity}</div></div>
                            <div><div class="text-xs text-slate-500">Weight</div><div class="text-2xl font-bold text-[#f97316]">${weight}</div></div>
                        </div>
                    `;
                } else if (isTelehandler) {
                    statsHTML = `
                        <div class="grid grid-cols-3 gap-4 text-center mt-6">
                            <div><div class="text-xs text-slate-500">Max Lift Height</div><div class="text-2xl font-bold text-[#f97316]">${liftHeight}</div></div>
                            <div><div class="text-xs text-slate-500">Capacity</div><div class="text-2xl font-bold text-[#f97316]">${capacity}</div></div>
                            <div><div class="text-xs text-slate-500">Weight</div><div class="text-2xl font-bold text-[#f97316]">${weight}</div></div>
                        </div>
                    `;
                } else {
                    statsHTML = `
                        <div class="grid grid-cols-3 gap-4 text-center mt-6">
                            <div><div class="text-xs text-slate-500">Weight</div><div class="text-2xl font-bold text-[#f97316]">${weight}</div></div>
                            <div><div class="text-xs text-slate-500">HP</div><div class="text-2xl font-bold text-[#f97316]">${specs.net_hp || specs.gross_hp || 0}</div></div>
                            <div><div class="text-xs text-slate-500">Capacity</div><div class="text-2xl font-bold text-[#f97316]">${capacity}</div></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-700 text-slate-200">${subcategory}</span>
                            <div class="font-bold text-xl mt-3">${model.brand} ${model.model}</div>
                        </div>
                    </div>
                    ${statsHTML}
                    <div class="mt-6 pt-4 border-t border-slate-800 text-xs text-slate-400">Click for full specs →</div>
                `;
                container.appendChild(card);
            });
        }

        function setUnit(unit) {
            currentUnit = unit;
            const btnUs = document.getElementById('btn-us');
            const btnMetric = document.getElementById('btn-metric');

            if (unit === 'us') {
                btnUs.classList.add('bg-slate-700', 'text-white');
                btnUs.classList.remove('text-slate-400');
                btnMetric.classList.remove('bg-slate-700', 'text-white');
                btnMetric.classList.add('text-slate-400');
            } else {
                btnMetric.classList.add('bg-slate-700', 'text-white');
                btnMetric.classList.remove('text-slate-400');
                btnUs.classList.remove('bg-slate-700', 'text-white');
                btnUs.classList.add('text-slate-400');
            }
            renderEquipmentCards();
        }

        // Full modal (same as previous)
        function showModelDetail(id) {
            const model = equipmentDatabase.find(m => m.id === id);
            if (!model) return;
            alert(`Full detailed modal for ${model.brand} ${model.model} coming soon...`);
        }

        async function init() {
            document.getElementById('btn-us').classList.add('bg-slate-700', 'text-white');
            await loadAerialEquipment();
        }

        window.onload = init;
    </script>
</body>
</html>
