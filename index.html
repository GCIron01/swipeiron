<head>

<body class="bg-slate-950 text-slate-200">
    <!-- NAV -->
<nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        
        <!-- Logo + Site Name -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-[#f97316] rounded flex items-center justify-center text-white font-bold text-2xl">S</div>
            <div class="text-3xl font-semibold tracking-tight">SwipeIron</div>
        </div>

        <!-- NAV LINKS -->
        <div class="flex items-center gap-6 text-sm md:text-base font-medium flex-wrap md:flex-nowrap">
            <a href="#" onclick="showPage('home')" class="hover:text-[#f97316]">Home</a>
            <a href="#" onclick="showPage('brands')" class="hover:text-[#f97316]">Brands</a>

        </div>

        <!-- US / Metric Toggle -->
        <div class="flex items-center bg-slate-800 rounded-2xl p-1 border border-slate-700">
            <div onclick="switchUnit('us')" id="btn-us" 
                 class="px-4 py-1.5 rounded-xl text-sm font-semibold cursor-pointer flex items-center gap-x-2 bg-slate-700 text-white">
                <i class="fa-solid fa-flag-usa"></i><span>US</span>
            </div>
            <div onclick="switchUnit('metric')" id="btn-metric" 
                 class="px-4 py-1.5 rounded-xl text-sm font-semibold cursor-pointer flex items-center gap-x-2 text-slate-400 hover:text-white">
                <i class="fa-solid fa-globe"></i><span>Metric</span>
            </div>
        </div>

    </div>
</nav>

    <div id="page-content" class="max-w-7xl mx-auto px-6 py-8"></div>

    <script>
        const SUPABASE_URL = 'https://kffjahvpapxekbjfhinm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8jEfhEqfTx71HPiyUcybYg_A3mGzlm0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let equipmentDatabase = [];
        let currentUnit = 'us';
        let compareList = [];
        let currentPage = 'home';
        let currentBrand = null;

        async function loadDataFromSupabase() {
            const { data, error } = await supabaseClient.from('equipment_models').select('*').order('brand', { ascending: true });
            if (error) { alert('Error loading data'); return; }
            equipmentDatabase = data;
        }

        function switchUnit(unit) {
    currentUnit = unit;

    const btnUs = document.getElementById('btn-us');
    const btnMetric = document.getElementById('btn-metric');

    if (unit === 'us') {
        btnUs.classList.add('bg-slate-700', 'text-white');
        btnUs.classList.remove('text-slate-400');
        btnMetric.classList.remove('bg-slate-700', 'text-white');
        btnMetric.classList.add('text-slate-400');
    } else {
        btnMetric.classList.add('bg-slate-700', 'text-white');
        btnMetric.classList.remove('text-slate-400');
        btnUs.classList.remove('bg-slate-700', 'text-white');
        btnUs.classList.add('text-slate-400');
    }

    const container = document.getElementById('page-content');

    // Re-render the correct view based on current state
    if (currentPage === 'compare') {
        // If user is on the normal compare selection screen
        renderCompare(container);
    } 
    else if (document.querySelector('button[onclick*="showPage(\'compare\')"]') && 
             container.innerHTML.includes('Comparison Results')) {
        // If user is viewing Comparison Results, re-render the comparison
        performComparison();
    } 
    else if (currentPage === 'construction') {
        renderConstruction(container);
    } 
    else if (currentPage === 'aerial') {
        renderAerial(container);
    } 
    else if (currentPage === 'brand-detail' && currentBrand) {
        showBrandDetail(currentBrand);
    }
}
        function createModelCardHTML(model) {
    const specs = model.specs || {};
    const isAerial = model.category === 'Aerial' || (model.subcategory && model.subcategory.includes('Scissor'));
    const isMaterialHandling = model.category === 'Material Handling';

            // ==================== AERIAL CARDS ====================
    if (isAerial) {
        let height = specs.platform_height_elevated_ft || specs.platform_height_ft || 0;
        let capacity = specs.platform_capacity_lbs
            || specs.platform_capacity_restricted_lbs
            || specs.platform_capacity_unrestricted_lbs
            || 0;
        let weight = specs.operating_weight_lbs || specs.weight_lbs || 0;

                // ==================== POWER BADGE (IMPROVED) ====================
        let powerBadge = '';

        // First priority: Use power_source if it exists and is valid
        if (model.power_source && model.power_source.trim() !== '') {
            if (model.power_source === 'Electric') {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-blue-600/20 text-blue-400 border border-blue-500/30">
                        <i class="fa-solid fa-bolt"></i>
                        <span>Electric</span>
                    </span>`;
            } 
            else if (model.power_source === 'Hybrid') {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-purple-600/20 text-purple-400 border border-purple-500/30">
                        <i class="fa-solid fa-sync fa-spin-pulse"></i>
                        <span>Hybrid</span>
                    </span>`;
            } 
            else if (model.power_source === 'Engine') {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-orange-600/20 text-orange-400 border border-orange-500/30">
                        <i class="fa-solid fa-gas-pump"></i>
                        <span>Engine</span>
                    </span>`;
            }
        } 
        // Fallback: Check subcategory name if power_source is missing
        else if (model.subcategory) {
            if (model.subcategory.includes('Electric')) {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-blue-600/20 text-blue-400 border border-blue-500/30">
                        <i class="fa-solid fa-bolt"></i>
                        <span>Electric</span>
                    </span>`;
            } 
            else if (model.subcategory.includes('Hybrid')) {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-purple-600/20 text-purple-400 border border-purple-500/30">
                        <i class="fa-solid fa-sync fa-spin-pulse"></i>
                        <span>Hybrid</span>
                    </span>`;
            } 
            else if (model.subcategory.includes('Engine')) {
                powerBadge = `
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold 
                                 bg-orange-600/20 text-orange-400 border border-orange-500/30">
                        <i class="fa-solid fa-gas-pump"></i>
                        <span>Engine</span>
                    </span>`;
            }
        }

        // Clean model name for Towable Boom Lifts
        let displayModel = `${model.brand} ${model.model}`;
        if (model.subcategory === 'Towable Boom Lift') {
            displayModel = `${model.brand} ${model.model.replace(/\s*\(Electric\)|\s*\(Hybrid\)|\s*\(Engine\)/gi, '')}`;
        }

        const hasRestricted = specs.platform_capacity_restricted_lbs && specs.platform_capacity_unrestricted_lbs;
        const showAsterisk = hasRestricted && (specs.platform_capacity_restricted_lbs !== specs.platform_capacity_unrestricted_lbs);

        if (currentUnit === 'metric') {
            height = height > 0 ? (height * 0.3048).toFixed(1) : 0;
            capacity = capacity > 0 ? Math.round(capacity * 0.4536) : 0;
            weight = weight > 0 ? Math.round(weight * 0.4536) : 0;
        }

        const hUnit = currentUnit === 'us' ? 'ft' : 'm';
        const cUnit = currentUnit === 'us' ? 'lbs' : 'kg';
        const wUnit = currentUnit === 'us' ? 'lbs' : 'kg';

        const displayHeight = height > 0 ? height : '—';
        let displayCapacity = capacity > 0 ? capacity.toLocaleString() : '—';
        if (showAsterisk && currentUnit === 'us') displayCapacity = displayCapacity + ' *';
        const displayWeight = weight > 0 ? weight.toLocaleString() : '—';

        return `
            <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="text-xs text-orange-500 font-semibold">${model.subcategory || 'Aerial'}</div>
                        <div class="font-bold text-xl">${displayModel}</div>
                    </div>
                    ${powerBadge}
                </div>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <div class="text-xs text-slate-500">Platform Height</div>
                        <div class="text-2xl font-bold text-[#f97316]">${displayHeight}</div>
                        <div class="text-xs text-slate-500">${hUnit}</div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500">Capacity</div>
                        <div class="text-2xl font-bold text-[#f97316]">${displayCapacity}</div>
                        <div class="text-xs text-slate-500">${cUnit}</div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500">Weight</div>
                        <div class="text-2xl font-bold text-[#f97316]">${displayWeight}</div>
                        <div class="text-xs text-slate-500">${wUnit}</div>
                    </div>
                </div>
                <div class="mt-5 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                    <div>Click for full specs →</div>
                </div>
            </div>
        `;
    }
    
    else if (isMaterialHandling) {
    let liftHeight = specs.max_lift_height_ft || 0;
    let capacity = specs.rated_capacity_lbs || 0;
    let weight = specs.operating_weight_lbs || 0;
    let engineHp = specs.engine_gross_hp || specs.engine_hp || 0;

    if (currentUnit === 'metric') {
        liftHeight = liftHeight > 0 ? (liftHeight * 0.3048).toFixed(1) : 0;
        capacity = capacity > 0 ? Math.round(capacity * 0.4536) : 0;
        weight = weight > 0 ? Math.round(weight * 0.4536) : 0;
    }

    const hUnit = currentUnit === 'us' ? 'ft' : 'm';
    const cUnit = currentUnit === 'us' ? 'lbs' : 'kg';
    const wUnit = currentUnit === 'us' ? 'lbs' : 'kg';

    const displayHeight = liftHeight > 0 ? liftHeight : '—';
    const displayCapacity = capacity > 0 ? capacity.toLocaleString() : '—';
    const displayWeight = weight > 0 ? weight.toLocaleString() : '—';
    const displayHp = engineHp > 0 ? engineHp : '—';

    // Determine badge style based on subcategory
    const isRotating = model.subcategory === 'Rotating Telehandler';
    const subcategoryBadge = isRotating 
        ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-violet-600 text-white">${model.subcategory}</span>`
        : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-700 text-slate-200">${model.subcategory || 'Telehandler'}</span>`;

    const rotating360Badge = isRotating 
        ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-violet-500/20 text-violet-400 border border-violet-500/30">
                <i class="fa-solid fa-sync fa-spin-pulse"></i>
                <span>360°</span>
           </span>` 
        : '';

    return `
        <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <!-- Subcategory Badge + 360° Indicator -->
                    <div class="flex items-center gap-2 mb-1">
                        ${subcategoryBadge}
                        ${rotating360Badge}
                    </div>
                    <div class="font-bold text-xl">${model.brand} ${model.model}</div>
                </div>
                <div class="px-3 py-1 text-xs rounded-full bg-amber-900 text-amber-400">Engine</div>
            </div>

            <div class="grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="text-xs text-slate-500">Max Lift Height</div>
                    <div class="text-2xl font-bold text-[#f97316]">${displayHeight}</div>
                    <div class="text-xs text-slate-500">${hUnit}</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500">Rated Capacity</div>
                    <div class="text-2xl font-bold text-[#f97316]">${displayCapacity}</div>
                    <div class="text-xs text-slate-500">${cUnit}</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500">Operating Weight</div>
                    <div class="text-2xl font-bold text-[#f97316]">${displayWeight}</div>
                    <div class="text-xs text-slate-500">${wUnit}</div>
                </div>
            </div>

            <div class="mt-5 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                <div>Click for full specs →</div>
            </div>
        </div>
    `;
}
    // ==================== CONSTRUCTION (DEFAULT) ====================
    else {
        const weight = model.operating_weight_lbs || specs.operating_weight_lbs || '—';
        const hp = model.engine_hp || specs.engine_hp || '—';
        const bucket = model.bucket_capacity_cy || specs.bucket_capacity_cy || '—';

        return `
            <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
                <div class="flex justify-between">
                    <div>
                        <div class="text-sm text-slate-400">${model.year || ''} • ${model.category || ''}</div>
                        <div class="font-bold text-xl">${model.brand} ${model.model}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-500">NEW</div>
                        <div class="font-semibold">$${(model.new_price_usd || 0).toLocaleString()}</div>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-3 gap-4 text-center text-sm">
                    <div><div class="text-[#f97316] font-bold">${weight}</div><div class="text-xs text-slate-500">lbs</div></div>
                    <div><div class="text-[#f97316] font-bold">${hp}</div><div class="text-xs text-slate-500">hp</div></div>
                    <div><div class="text-[#f97316] font-bold">${bucket}</div><div class="text-xs text-slate-500">ft / cy</div></div>
                </div>
            </div>
        `;
    }
}
        function showPage(page) {
            currentPage = page;
            const container = document.getElementById('page-content');
            if (page === 'home') renderHome(container);
            else if (page === 'brands') renderBrands(container);
            else if (page === 'construction') renderConstruction(container);
            else if (page === 'aerial') renderAerial(container);
            else if (page === 'models') renderAllModels(container);
            else if (page === 'compare') renderCompare(container);
        }

        function renderHome(container) {
    container.innerHTML = `
        <div class="text-center py-12">
            <h1 class="text-6xl font-display font-bold tracking-tighter mb-4">Swipe. Compare. Decide.</h1>
            <p class="text-2xl text-slate-400 max-w-2xl mx-auto">The definitive spec comparison platform for heavy equipment.</p>
        </div>

        <!-- BROWSE BY BRAND -->
        <div class="mb-12">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-semibold">Browse by Brand</h2>
                <a href="#" onclick="showPage('brands'); return false;" class="text-sm text-orange-400 hover:underline">View all brands →</a>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <a href="#" onclick="showPage('brands'); return false;" class="block bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-orange-500/40 p-5 rounded-2xl text-center transition-all">
                    <div class="font-semibold text-lg">All Brands</div>
                    <div class="text-xs text-slate-400 mt-1">Aerial + Construction</div>
                </a>
                <a href="#" onclick="showPage('aerial'); return false;" class="block bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-orange-500/40 p-5 rounded-2xl text-center transition-all">
                    <div class="font-semibold text-lg">Aerial Brands</div>
                    <div class="text-xs text-slate-400 mt-1">JLG, Genie, Skyjack...</div>
                </a>
                <a href="#" onclick="showPage('construction'); return false;" class="block bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-orange-500/40 p-5 rounded-2xl text-center transition-all">
                    <div class="font-semibold text-lg">Construction Brands</div>
                    <div class="text-xs text-slate-400 mt-1">Cat, Komatsu, Volvo...</div>
                </a>
            </div>
        </div>

        <!-- DISCLAIMER -->
        <div class="text-xs text-slate-500 border-t border-slate-800 pt-6 max-w-4xl">
            <p><strong>Disclaimer:</strong> SwipeIron is an independent platform and is not affiliated with, endorsed by, or sponsored by any equipment manufacturer. 
            All brand names, logos, and trademarks are the property of their respective owners. 
            The specifications and data shown on this site are for informational and comparison purposes only. While we strive for accuracy, 
            errors, omissions, or outdated information may occur. Always verify specifications directly with the manufacturer or official documentation before making any decisions.</p>
        </div>
    `;
}

        function renderBrands(container) {
            const brands = [...new Set(equipmentDatabase.map(m => m.brand))];
            let html = `<h2 class="section-header mb-8">Equipment Brands</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            brands.forEach(brand => {
                const count = equipmentDatabase.filter(m => m.brand === brand).length;
                html += `<div onclick="showBrandDetail('${brand}')" class="bg-slate-900 hover:bg-slate-800 p-8 rounded-3xl cursor-pointer border border-slate-800"><div class="flex justify-between"><div><div class="font-bold text-3xl">${brand}</div><div class="text-slate-400">${count} models</div></div><i class="fa-solid fa-industry text-4xl text-[#f97316]"></i></div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function showBrandDetail(brand) {
            currentBrand = brand;
            currentPage = 'brand-detail';
            
            const container = document.getElementById('page-content');
            const models = equipmentDatabase.filter(m => m.brand === brand);
            let html = `<button onclick="showPage('brands')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Brands</button><div class="flex items-center gap-4 mb-8"><div class="w-16 h-16 bg-[#f97316] rounded-2xl flex items-center justify-center"><i class="fa-solid fa-industry text-4xl text-white"></i></div><div><div class="text-5xl font-bold">${brand}</div><div class="text-xl text-slate-400">${models.length} models</div></div></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            models.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderConstruction(container) {
            const models = equipmentDatabase.filter(m => m.category === 'Construction');
            let html = `<h2 class="section-header mb-8">Construction Equipment</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            models.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderAerial(container) {
            const models = equipmentDatabase.filter(m => m.category === 'Aerial' || (m.subcategory && m.subcategory.includes('Scissor')));
            let html = `<h2 class="section-header mb-8">Aerial Equipment</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
            models.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderAllModels(container) {
            let html = `<h2 class="section-header mb-8">All Equipment Models</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            equipmentDatabase.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function showModelDetail(id) {
    const model = equipmentDatabase.find(m => m.id === id);
    if (!model) return;

    const specs = model.specs || {};

    // Create modal
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4';
    modal.innerHTML = `
        <div class="bg-slate-900 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto border border-slate-700">
            <!-- Header -->
            <div class="flex justify-between items-start p-8 border-b border-slate-700">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold ${getPowerBadgeClass(model)}">
    ${getPowerType(model) === 'Electric' ? '<i class="fa-solid fa-bolt"></i>' : ''}
    ${getPowerType(model) === 'Hybrid' ? '<i class="fa-solid fa-sync fa-spin-pulse"></i>' : ''}
    ${getPowerType(model) === 'Engine' ? '<i class="fa-solid fa-gas-pump"></i>' : ''}
    <span>${getPowerType(model)}</span>
</span>
                        <span class="text-xs text-orange-500 font-semibold">${model.subcategory}</span>
                    </div>
                    <h2 class="text-4xl font-bold">${model.brand} ${model.model}</h2>
                </div>
                <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>

            <!-- Key Specs -->
            <div class="p-8 grid grid-cols-2 md:grid-cols-4 gap-6">
                ${createSpecItem('Platform Height', specs.platform_height_ft || specs.platform_height_elevated_ft, 'ft')}
                ${createSpecItem('Horizontal Reach', specs.horizontal_reach_ft, 'ft')}
                ${createSpecItem('Platform Capacity', specs.platform_capacity_lbs, 'lbs')}
                ${createSpecItem('Operating Weight', specs.operating_weight_lbs, 'lbs')}
            </div>

            <!-- Full Specifications -->
            <div class="px-8 pb-8">
                <h3 class="text-xl font-semibold mb-4 text-white">Full Specifications</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3 text-sm">
                    ${buildSpecsList(specs)}
                </div>
            </div>
        </div>
    `;

    document.body.appendChild(modal);
}

// Helper functions
function getPowerType(model) {
    if (!model.power_source) {
        // Fallback based on subcategory
        if (model.subcategory && model.subcategory.includes('Electric')) return 'Electric';
        if (model.subcategory && model.subcategory.includes('Hybrid')) return 'Hybrid';
        if (model.subcategory && model.subcategory.includes('Engine')) return 'Engine';
        return 'Electric';
    }
    return model.power_source;
}

function getPowerBadgeClass(model) {
    const power = model.power_source || '';

    if (power === 'Electric' || (model.subcategory && model.subcategory.includes('Electric'))) {
        return 'bg-blue-600/20 text-blue-400 border border-blue-500/30';
    }
    if (power === 'Hybrid' || (model.subcategory && model.subcategory.includes('Hybrid'))) {
        return 'bg-purple-600/20 text-purple-400 border border-purple-500/30';
    }
    if (power === 'Engine' || (model.subcategory && model.subcategory.includes('Engine'))) {
        return 'bg-orange-600/20 text-orange-400 border border-orange-500/30';
    }
    return 'bg-emerald-900 text-emerald-400';
}

function createSpecItem(label, value, unit) {
    if (!value) return '';
    return `
        <div class="bg-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400">${label}</div>
            <div class="text-2xl font-bold text-[#f97316]">${Number(value).toLocaleString()}</div>
            <div class="text-xs text-slate-500">${unit}</div>
        </div>
    `;
}

function buildSpecsList(specs) {
    let html = '';
    for (const [key, value] of Object.entries(specs)) {
        if (key === 'notes') continue;
        const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        html += `
            <div class="flex justify-between py-2 border-b border-slate-800">
                <span class="text-slate-400">${label}</span>
                <span class="font-medium text-white">${value}</span>
            </div>
        `;
    }
    return html;
}

        function renderCompare(container) {
            let html = `
                <h2 class="section-header mb-4">Side-by-Side Comparison</h2>
                <p class="text-slate-400 mb-6">Select up to 4 machines to compare real specifications</p>
                
                <div class="bg-slate-900 p-6 rounded-3xl mb-6">
                    <div class="text-sm text-slate-400 mb-3">Select machines:</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
            
            equipmentDatabase.forEach(model => {
                const isSelected = compareList.some(m => m.id === model.id);
                html += `
                    <div onclick="toggleCompare(${model.id})" class="p-3 rounded-2xl cursor-pointer text-sm flex items-center gap-2 ${isSelected ? 'bg-[#f97316] text-white' : 'bg-slate-800 hover:bg-slate-700'}">
                        <i class="fa-solid ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i>
                        <span>${model.brand} ${model.model}</span>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            if (compareList.length > 0) {
                html += `
                    <div class="bg-slate-900 p-6 rounded-3xl mb-6">
                        <div class="flex justify-between items-center mb-4">
                            <div class="font-semibold">Selected (${compareList.length}/4)</div>
                            <button onclick="performComparison()" class="px-8 py-3 bg-[#f97316] hover:bg-orange-600 text-white font-semibold rounded-2xl flex items-center gap-2">
                                <i class="fa-solid fa-balance-scale"></i> <span>Compare Now</span>
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-3">`;
                
                compareList.forEach((model, index) => {
                    html += `
                        <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-2xl">
                            <span>${model.brand} ${model.model}</span>
                            <button onclick="removeFromCompare(${index})" class="text-red-400 hover:text-red-500 ml-2"><i class="fa-solid fa-times"></i></button>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            container.innerHTML = html;
        }

        function toggleCompare(id) {
    const model = equipmentDatabase.find(m => m.id === id);
    if (!model) return;

    const index = compareList.findIndex(m => m.id === id);

    // If already selected → remove it
    if (index > -1) {
        compareList.splice(index, 1);
    } 
    else {
        // Check if we can add this machine
        if (compareList.length > 0) {
            const existingSubcategory = compareList[0].subcategory;
            
            if (model.subcategory !== existingSubcategory) {
                showToast(`You can only compare machines in the same subcategory (${existingSubcategory}).`, true);
                return;
            }
        }

        if (compareList.length < 4) {
            compareList.push(model);
        } else {
            showToast('You can only compare up to 4 machines at a time.');
        }
    }

    renderCompare(document.getElementById('page-content'));
}

        function removeFromCompare(index) {
            compareList.splice(index, 1);
            renderCompare(document.getElementById('page-content'));
        }

        function performComparison() {
            const container = document.getElementById('page-content');
            
            let html = `
                <button onclick="showPage('compare')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back</button>
                <h2 class="section-header mb-8">Comparison Results</h2>
                <div class="overflow-x-auto">
                    <table class="w-full bg-slate-900 rounded-3xl overflow-hidden text-sm">
                        <thead>
                            <tr class="border-b border-slate-800">
                                <th class="p-4 text-left font-semibold">Specification</th>`;
            
            compareList.forEach(model => {
                html += `<th class="p-4 text-center"><div class="font-bold">${model.brand}</div><div class="text-xs text-slate-400">${model.model}</div></th>`;
            });
            
            html += `</tr></thead><tbody>`;
            
            const isAerialComparison = compareList.some(m => m.category === 'Aerial' || (m.subcategory && m.subcategory.includes('Scissor')));
            
            if (isAerialComparison) {
    const aerialRows = [
        { 
            label: 'Platform Height (ft)', 
            keys: ['platform_height_elevated_ft', 'platform_height_ft'] 
        },
        { 
            label: 'Platform Capacity (lbs)', 
            keys: ['platform_capacity_lbs', 'platform_capacity_restricted_lbs', 'platform_capacity_unrestricted_lbs'] 
        },
        { 
            label: 'Operating Weight (lbs)', 
            keys: ['operating_weight_lbs', 'weight_lbs'] 
        },
        { 
            label: 'Power Source', 
            keys: ['power_source'] 
        },
        { 
            label: 'Gradeability (%)', 
            keys: ['gradeability_percent', 'gradeability_4wd_percent', 'gradeability_2wd_percent'] 
        },
        { 
            label: 'Drive Speed (mph)', 
            keys: ['drive_speed_mph', 'drive_speed_lowered_mph'] 
        },
    ];
    
    aerialRows.forEach(row => {
        html += `<tr class="border-b border-slate-800"><td class="p-4 font-medium">${row.label}</td>`;
        compareList.forEach(model => {
            const specs = model.specs || {};
            
            // Try multiple keys until we find a value
            let value = '—';
            for (let key of row.keys) {
                if (specs[key]) {
                    value = specs[key];
                    break;
                }
            }
            
            // Format nicely
            if (value !== '—') {
                if (row.label.includes('Height')) value = value + ' ft';
                if (row.label.includes('Capacity') || row.label.includes('Weight')) {
                    value = value.toLocaleString() + ' lbs';
                }
                if (row.label.includes('Gradeability')) value = value + '%';
                if (row.label.includes('Speed')) value = value + ' mph';
            }
            
            html += `<td class="p-4 text-center font-semibold text-[#f97316]">${value}</td>`;
        });
        html += `</tr>`;
    });
} else {
                const constructionRows = [
                    { label: 'Operating Weight (lbs)', key: 'operating_weight_lbs' },
                    { label: 'Engine HP', key: 'engine_hp' },
                    { label: 'Bucket Capacity (cy)', key: 'bucket_capacity_cy' },
                    { label: 'New Price (USD)', key: 'new_price_usd', format: v => '$' + (v || 0).toLocaleString() },
                ];
                
                constructionRows.forEach(row => {
                    html += `<tr class="border-b border-slate-800"><td class="p-4 font-medium">${row.label}</td>`;
                    compareList.forEach(model => {
                        let value = model[row.key] || (model.specs && model.specs[row.key]) || '—';
                        if (row.format) value = row.format(value);
                        html += `<td class="p-4 text-center font-semibold text-[#f97316]">${value}</td>`;
                    });
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        async function init() {
            await loadDataFromSupabase();
            const container = document.getElementById('page-content');
            renderHome(container);
            document.getElementById('btn-us').classList.add('bg-slate-700', 'text-white');
            console.log('%c[SwipeIron] Rich comparison with real specs loaded', 'color:#f97316');
        }
        
        window.onload = init;
    </script>
</body>
</html>
