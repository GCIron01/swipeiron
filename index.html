<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SwipeIron - Professional heavy equipment spec comparison. Swipe. Compare. Decide.">
    <title>SwipeIron | Swipe. Compare. Decide.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root { --orange: #f97316; }
        
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        
        .equipment-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .equipment-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(15 23 42 / 0.1); }
        
        .nav-active { color: #f97316; font-weight: 600; }
        
        .section-header { font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; letter-spacing: -0.025em; }
        
        .warm-orange { color: #f97316; }
        .bg-warm-orange { background-color: #f97316; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <!-- NAV -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#f97316] rounded flex items-center justify-center text-white font-bold text-2xl">S</div>
                <div class="text-3xl font-semibold tracking-tight">SwipeIron</div>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-base font-medium">
                <a href="#" onclick="showPage('home')" class="nav-link hover:text-[#f97316]">Home</a>
                <a href="#" onclick="showPage('brands')" class="nav-link hover:text-[#f97316]">Brands</a>
                <a href="#" onclick="showPage('models')" class="nav-link hover:text-[#f97316]">All Models</a>
                <a href="#" onclick="showPage('compare')" class="nav-link hover:text-[#f97316]">Compare</a>
            </div>
            
            <div class="text-[#f97316] font-semibold text-lg">Swipe. Compare. Decide.</div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div id="page-content" class="max-w-7xl mx-auto px-6 py-8"></div>

    <script>
        // ==================== DATA ====================
        const equipmentDatabase = [
            { id: 1, brand: "Caterpillar", model: "320 GC", category: "Excavator", year: 2024, operating_weight_lbs: 48500, engine_hp: 148, bucket_capacity_cy: 1.6, max_reach_ft: 31.5, fuel_capacity_gal: 92, new_price_usd: 278400, used_price_usd: 195000 },
            { id: 2, brand: "John Deere", model: "210G LC", category: "Excavator", year: 2023, operating_weight_lbs: 50200, engine_hp: 159, bucket_capacity_cy: 1.55, max_reach_ft: 32.1, fuel_capacity_gal: 95, new_price_usd: 265000, used_price_usd: 178000 },
            { id: 3, brand: "Komatsu", model: "PC200-8", category: "Excavator", year: 2024, operating_weight_lbs: 44500, engine_hp: 138, bucket_capacity_cy: 1.4, max_reach_ft: 30.8, fuel_capacity_gal: 88, new_price_usd: 242000, used_price_usd: 162000 },
            { id: 4, brand: "Volvo", model: "EC220E", category: "Excavator", year: 2023, operating_weight_lbs: 47800, engine_hp: 166, bucket_capacity_cy: 1.5, max_reach_ft: 31.8, fuel_capacity_gal: 94, new_price_usd: 271000, used_price_usd: 189000 },
            { id: 5, brand: "Hitachi", model: "ZX350-6", category: "Excavator", year: 2024, operating_weight_lbs: 76200, engine_hp: 268, bucket_capacity_cy: 2.8, max_reach_ft: 38.4, fuel_capacity_gal: 140, new_price_usd: 425000, used_price_usd: 298000 },
            { id: 6, brand: "Caterpillar", model: "950M", category: "Wheel Loader", year: 2024, operating_weight_lbs: 38500, engine_hp: 250, bucket_capacity_cy: 3.5, max_reach_ft: 14.2, fuel_capacity_gal: 78, new_price_usd: 312000, used_price_usd: 215000 },
            { id: 7, brand: "John Deere", model: "644L", category: "Wheel Loader", year: 2023, operating_weight_lbs: 41200, engine_hp: 265, bucket_capacity_cy: 3.8, max_reach_ft: 14.8, fuel_capacity_gal: 82, new_price_usd: 338000, used_price_usd: 229000 },
            { id: 8, brand: "Komatsu", model: "WA320-8", category: "Wheel Loader", year: 2024, operating_weight_lbs: 35800, engine_hp: 172, bucket_capacity_cy: 3.2, max_reach_ft: 13.5, fuel_capacity_gal: 72, new_price_usd: 268000, used_price_usd: 184000 },
            { id: 9, brand: "Caterpillar", model: "D6 XE", category: "Bulldozer", year: 2024, operating_weight_lbs: 49200, engine_hp: 215, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 105, new_price_usd: 465000, used_price_usd: 325000 },
            { id: 10, brand: "John Deere", model: "750K", category: "Bulldozer", year: 2023, operating_weight_lbs: 51500, engine_hp: 225, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 110, new_price_usd: 482000, used_price_usd: 339000 },
            { id: 11, brand: "Komatsu", model: "D65EX-18", category: "Bulldozer", year: 2024, operating_weight_lbs: 45500, engine_hp: 205, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 98, new_price_usd: 398000, used_price_usd: 278000 },
            { id: 12, brand: "Caterpillar", model: "140 GC", category: "Motor Grader", year: 2024, operating_weight_lbs: 35200, engine_hp: 188, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 85, new_price_usd: 298000, used_price_usd: 205000 },
            { id: 13, brand: "Volvo", model: "G930B", category: "Motor Grader", year: 2023, operating_weight_lbs: 33800, engine_hp: 175, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 80, new_price_usd: 275000, used_price_usd: 189000 },
            { id: 14, brand: "Bomag", model: "BW213D-5", category: "Compactor", year: 2024, operating_weight_lbs: 28600, engine_hp: 114, bucket_capacity_cy: null, max_reach_ft: null, fuel_capacity_gal: 52, new_price_usd: 168000, used_price_usd: 112000 },
            { id: 15, brand: "Case", model: "580 Super N", category: "Skid Steer", year: 2023, operating_weight_lbs: 7850, engine_hp: 72, bucket_capacity_cy: 0.75, max_reach_ft: 8.4, fuel_capacity_gal: 22, new_price_usd: 52000, used_price_usd: 34500 },
            { id: 16, brand: "Caterpillar", model: "299D3 XE", category: "Skid Steer", year: 2024, operating_weight_lbs: 11200, engine_hp: 110, bucket_capacity_cy: 0.95, max_reach_ft: 9.1, fuel_capacity_gal: 32, new_price_usd: 78000, used_price_usd: 52000 }
        ];

        let compareList = [];
        let currentPage = 'home';

        // ==================== NAVIGATION ====================
        function showPage(page) {
            currentPage = page;
            const container = document.getElementById('page-content');
            
            if (page === 'home') renderHome(container);
            else if (page === 'brands') renderBrands(container);
            else if (page === 'models') renderAllModels(container);
            else if (page === 'compare') renderCompare(container);
        }

        // ==================== RENDER FUNCTIONS ====================
        function renderHome(container) {
            container.innerHTML = `
                <div class="text-center py-16 hero-bg rounded-3xl mb-12">
                    <h1 class="text-6xl font-display font-bold tracking-tighter mb-4">Swipe. Compare. Decide.</h1>
                    <p class="text-2xl text-slate-400 max-w-2xl mx-auto">The definitive spec comparison platform for heavy equipment.</p>
                    <div class="mt-8 flex justify-center gap-4">
                        <button onclick="showPage('compare')" class="px-8 py-4 bg-[#f97316] text-white font-semibold rounded-3xl text-lg hover:bg-orange-600 transition-all">Start Comparing</button>
                        <button onclick="showPage('brands')" class="px-8 py-4 border border-slate-700 hover:bg-slate-800 font-semibold rounded-3xl text-lg">Browse Brands</button>
                    </div>
                </div>
                
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div class="bg-slate-900 p-8 rounded-3xl">
                        <div class="text-4xl font-bold text-[#f97316]">52,847</div>
                        <div class="text-slate-400">Equipment Models</div>
                    </div>
                    <div class="bg-slate-900 p-8 rounded-3xl">
                        <div class="text-4xl font-bold text-[#f97316]">187</div>
                        <div class="text-slate-400">Manufacturers</div>
                    </div>
                    <div class="bg-slate-900 p-8 rounded-3xl">
                        <div class="text-4xl font-bold text-[#f97316]">4.2m</div>
                        <div class="text-slate-400">Comparisons Run</div>
                    </div>
                </div>
            `;
        }

        function renderBrands(container) {
            const brands = [...new Set(equipmentDatabase.map(m => m.brand))];
            let html = `<h2 class="section-header mb-8">Equipment Brands</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            
            brands.forEach(brand => {
                const brandModels = equipmentDatabase.filter(m => m.brand === brand);
                html += `
                    <div onclick="showBrandDetail('${brand}')" class="bg-slate-900 hover:bg-slate-800 transition-all p-8 rounded-3xl cursor-pointer border border-slate-800">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-bold text-3xl">${brand}</div>
                                <div class="text-slate-400">${brandModels.length} models</div>
                            </div>
                            <i class="fa-solid fa-industry text-4xl text-[#f97316]"></i>
                        </div>
                        <div class="mt-6 text-sm text-slate-400">Avg. New Price: $${Math.round(brandModels.reduce((a, b) => a + b.new_price_usd, 0) / brandModels.length).toLocaleString()}</div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function showBrandDetail(brand) {
            const container = document.getElementById('page-content');
            const brandModels = equipmentDatabase.filter(m => m.brand === brand);
            
            let html = `
                <button onclick="showPage('brands')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Brands</button>
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-16 h-16 bg-[#f97316] rounded-2xl flex items-center justify-center"><i class="fa-solid fa-industry text-4xl text-white"></i></div>
                    <div><div class="text-5xl font-bold">${brand}</div><div class="text-xl text-slate-400">${brandModels.length} models</div></div>
                </div>
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            
            brandModels.forEach(model => {
                html += createModelCardHTML(model);
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function createModelCardHTML(model) {
            return `
                <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
                    <div class="flex justify-between">
                        <div>
                            <div class="text-sm text-slate-400">${model.year} • ${model.category}</div>
                            <div class="font-bold text-xl">${model.brand} ${model.model}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-slate-500">NEW</div>
                            <div class="font-semibold">$${model.new_price_usd.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-3 gap-4 text-center text-sm">
                        <div><div class="text-[#f97316] font-bold">${model.operating_weight_lbs.toLocaleString()}</div><div class="text-xs text-slate-500">lbs</div></div>
                        <div><div class="text-[#f97316] font-bold">${model.engine_hp}</div><div class="text-xs text-slate-500">hp</div></div>
                        <div><div class="text-[#f97316] font-bold">${model.bucket_capacity_cy || '—'}</div><div class="text-xs text-slate-500">cy</div></div>
                    </div>
                </div>
            `;
        }

        function renderAllModels(container) {
            let html = `<h2 class="section-header mb-8">All Equipment Models</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            equipmentDatabase.forEach(model => html += createModelCardHTML(model));
            html += `</div>`;
            container.innerHTML = html;
        }

        function showModelDetail(id) {
            const model = equipmentDatabase.find(m => m.id === id);
            const container = document.getElementById('page-content');
            
            container.innerHTML = `
                <button onclick="showPage('models')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Models</button>
                
                <div class="bg-slate-900 rounded-3xl p-8">
                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="lg:w-2/3">
                            <div class="flex gap-3 mb-4">
                                <span class="px-4 py-1 bg-emerald-900 text-emerald-400 text-sm font-bold rounded-2xl">${model.year} MODEL</span>
                                <span class="px-4 py-1 bg-sky-900 text-sky-400 text-sm font-bold rounded-2xl">${model.category}</span>
                            </div>
                            
                            <h1 class="text-5xl font-bold">${model.brand} ${model.model}</h1>
                            <div class="text-3xl text-[#f97316] font-semibold mt-2">New: $${model.new_price_usd.toLocaleString()}</div>
                            
                            <div class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-6">
                                <div class="bg-slate-800 p-5 rounded-2xl"><div class="text-xs text-slate-500">OPERATING WEIGHT</div><div class="text-2xl font-bold mt-1">${model.operating_weight_lbs.toLocaleString()} <span class="text-sm">lbs</span></div></div>
                                <div class="bg-slate-800 p-5 rounded-2xl"><div class="text-xs text-slate-500">ENGINE POWER</div><div class="text-2xl font-bold mt-1">${model.engine_hp} <span class="text-sm">hp</span></div></div>
                                <div class="bg-slate-800 p-5 rounded-2xl"><div class="text-xs text-slate-500">BUCKET</div><div class="text-2xl font-bold mt-1">${model.bucket_capacity_cy || '—'} <span class="text-sm">cy</span></div></div>
                                <div class="bg-slate-800 p-5 rounded-2xl"><div class="text-xs text-slate-500">MAX REACH</div><div class="text-2xl font-bold mt-1">${model.max_reach_ft || '—'} <span class="text-sm">ft</span></div></div>
                            </div>
                        </div>
                        
                        <div class="lg:w-1/3">
                            <div class="bg-slate-950 p-6 rounded-3xl sticky top-24">
                                <div class="text-xs text-slate-500">CURRENT MARKET VALUE</div>
                                <div class="text-4xl font-bold mt-2">$${model.used_price_usd.toLocaleString()}</div>
                                
                                <div class="mt-6 space-y-3">
                                    <button onclick="addToCompare(${model.id}); showPage('compare')" class="w-full py-3 bg-white text-slate-900 font-semibold rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-100">
                                        <i class="fa-solid fa-exchange-alt"></i> Add to Compare
                                    </button>
                                    <button onclick="showToast('Full report feature coming soon!')" class="w-full py-3 border border-slate-700 text-white font-medium rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-800">
                                        Get Full Report (PDF)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCompare(container) {
            let html = `
                <h2 class="section-header mb-4">Side-by-Side Comparison</h2>
                <p class="text-slate-400 mb-6">Select up to 4 machines to compare specifications</p>
                
                <div class="bg-slate-900 p-6 rounded-3xl mb-6">
                    <div class="text-sm text-slate-400 mb-3">Select machines to compare:</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
            
            equipmentDatabase.forEach(model => {
                const isSelected = compareList.some(m => m.id === model.id);
                html += `
                    <div onclick="toggleCompare(${model.id})" class="p-3 rounded-2xl cursor-pointer text-sm flex items-center gap-2 ${isSelected ? 'bg-[#f97316] text-white' : 'bg-slate-800 hover:bg-slate-700'}">
                        <i class="fa-solid ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i>
                        <span>${model.brand} ${model.model}</span>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            if (compareList.length > 0) {
                html += `<div class="bg-slate-900 rounded-3xl p-6"><h3 class="font-semibold mb-4">Comparison (${compareList.length}/4)</h3><table class="w-full text-sm"><thead><tr><th class="text-left p-3">Spec</th>`;
                compareList.forEach(m => html += `<th class="p-3 text-center">${m.brand}<br><span class="text-xs text-slate-400">${m.model}</span></th>`);
                html += `</tr></thead><tbody>`;
                
                const specs = ['operating_weight_lbs', 'engine_hp', 'bucket_capacity_cy', 'max_reach_ft', 'fuel_capacity_gal', 'new_price_usd'];
                const labels = ['Operating Weight (lbs)', 'Engine HP', 'Bucket Capacity (cy)', 'Max Reach (ft)', 'Fuel Capacity (gal)', 'New Price (USD)'];
                
                specs.forEach((spec, i) => {
                    html += `<tr class="border-t border-slate-800"><td class="p-3 text-slate-400">${labels[i]}</td>`;
                    compareList.forEach(m => {
                        let val = m[spec];
                        if (spec === 'new_price_usd') val = '$' + val.toLocaleString();
                        else if (val === null) val = '—';
                        html += `<td class="p-3 text-center font-medium">${val}</td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            container.innerHTML = html;
        }

        function toggleCompare(id) {
            const index = compareList.findIndex(m => m.id === id);
            if (index > -1) compareList.splice(index, 1);
            else if (compareList.length < 4) compareList.push(equipmentDatabase.find(m => m.id === id));
            showPage('compare');
        }

        function addToCompare(id) {
            const model = equipmentDatabase.find(m => m.id === id);
            if (!compareList.some(m => m.id === id) && compareList.length < 4) compareList.push(model);
            showToast('Added to comparison!');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl z-50';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Initialize
        function init() {
            const container = document.getElementById('page-content');
            renderHome(container);
            
            // Keyboard support
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    showPage('models');
                }
            });
            
            console.log('%c[SwipeIron] Full professional version loaded successfully', 'color:#f97316');
        }
        
        window.onload = init;
    </script>
</body>
</html>
