<!DOCTYPE html>

        :root { --orange: #f97316; }

<body class="bg-slate-950 text-slate-200">

    <!-- NAV -->

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">

        let currentPage = 'home';

        function navigateTo(page) {
            currentPage = page;
            renderPage();

        function renderPage() {
            const container = document.getElementById('page-content');
            if (currentPage === 'home') {
                container.innerHTML = `<h1 class="text-5xl font-bold text-center hero-bg text-white py-20 rounded-3xl">Swipe. Compare. Decide.<br><span class="text-[#f97316]">Heavy Equipment Specs</span></h1>`;

            } else if (currentPage === 'models') {
                container.innerHTML = `<h2 class="text-4xl font-bold mb-8">All 16 Models</h2><p>Full model list with links to detail pages</p>`;
            } else if (currentPage === 'compare') {
                container.innerHTML = `<h2 class="text-4xl font-bold mb-8">Side-by-Side Comparison Tool</h2><p>Interactive comparison ready (add machines below)</p>`;
            }
        }

        // Initialize
        window.onload = () => renderPage();
