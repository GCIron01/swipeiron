<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SwipeIron - Professional heavy equipment spec comparison. Swipe. Compare. Decide.">
    <title>SwipeIron | Swipe. Compare. Decide.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        :root { --orange: #f97316; }
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .equipment-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .equipment-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(15 23 42 / 0.1); }
        .nav-active { color: #f97316; font-weight: 600; }
        .section-header { font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; letter-spacing: -0.025em; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <!-- NAV -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#f97316] rounded flex items-center justify-center text-white font-bold text-2xl">S</div>
                <div class="text-3xl font-semibold tracking-tight">SwipeIron</div>
            </div>
            <div class="hidden md:flex items-center gap-8 text-base font-medium">
                <a href="#" onclick="showPage('home')" class="nav-link hover:text-[#f97316]">Home</a>
                <a href="#" onclick="showPage('brands')" class="nav-link hover:text-[#f97316]">Brands</a>
                <a href="#" onclick="showPage('construction')" class="nav-link hover:text-[#f97316]">Construction</a>
                <a href="#" onclick="showPage('aerial')" class="nav-link hover:text-[#f97316]">Aerial</a>
                <a href="#" onclick="showPage('models')" class="nav-link hover:text-[#f97316]">All Models</a>
                <a href="#" onclick="showPage('compare')" class="nav-link hover:text-[#f97316]">Compare</a>
            </div>
            
            <div class="flex items-center bg-slate-800 rounded-2xl p-1 border border-slate-700">
                <div onclick="switchUnit('us')" id="btn-us"
                     class="px-4 py-1.5 rounded-xl text-sm font-semibold cursor-pointer flex items-center gap-x-2 bg-slate-700 text-white">
                    <i class="fa-solid fa-flag-usa"></i>
                    <span>US</span>
                </div>
                <div onclick="switchUnit('metric')" id="btn-metric"
                     class="px-4 py-1.5 rounded-xl text-sm font-semibold cursor-pointer flex items-center gap-x-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-globe"></i>
                    <span>Metric</span>
                </div>
            </div>
        </div>
    </nav>

    <div id="page-content" class="max-w-7xl mx-auto px-6 py-8"></div>

    <script>
        const SUPABASE_URL = 'https://kffjahvpapxekbjfhinm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8jEfhEqfTx71HPiyUcybYg_A3mGzlm0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let equipmentDatabase = [];
        let currentUnit = 'us';
        let compareList = [];
        let currentPage = 'home';

        async function loadDataFromSupabase() {
            const { data, error } = await supabaseClient.from('equipment_models').select('*').order('brand', { ascending: true });
            if (error) { console.error(error); alert('Error loading data'); return; }
            equipmentDatabase = data;
        }

        function switchUnit(unit) {
            currentUnit = unit;
            const btnUs = document.getElementById('btn-us');
            const btnMetric = document.getElementById('btn-metric');
            
            if (unit === 'us') {
                btnUs.classList.add('bg-slate-700', 'text-white');
                btnUs.classList.remove('text-slate-400');
                btnMetric.classList.remove('bg-slate-700', 'text-white');
                btnMetric.classList.add('text-slate-400');
            } else {
                btnMetric.classList.add('bg-slate-700', 'text-white');
                btnMetric.classList.remove('text-slate-400');
                btnUs.classList.remove('bg-slate-700', 'text-white');
                btnUs.classList.add('text-slate-400');
            }
            
            const container = document.getElementById('page-content');
            if (currentPage === 'compare') renderCompare(container);
            else if (currentPage === 'construction') renderConstruction(container);
            else if (currentPage === 'aerial') renderAerial(container);
            else if (currentPage === 'home') renderHome(container);
            else if (currentPage === 'models') renderAllModels(container);
            else if (currentPage === 'brands') renderBrands(container);
        }

        function createModelCardHTML(model) {
            const specs = model.specs || {};
            const isAerial = model.category === 'Aerial' || (model.subcategory && model.subcategory.includes('Scissor'));
            
            if (isAerial) {
                let height = specs.platform_height_elevated_ft || specs.platform_height_ft || 0;
                let capacity = specs.platform_capacity_lbs || 0;
                let weight = specs.operating_weight_lbs || specs.weight_lbs || 0;
                let powerType = model.subcategory && model.subcategory.includes('Engine') ? 'Engine' : 'Electric';
                
                if (currentUnit === 'metric') {
                    height = height > 0 ? (height * 0.3048).toFixed(1) : 0;
                    capacity = capacity > 0 ? Math.round(capacity * 0.4536) : 0;
                    weight = weight > 0 ? Math.round(weight * 0.4536) : 0;
                }
                
                const hUnit = currentUnit === 'us' ? 'ft' : 'm';
                const cUnit = currentUnit === 'us' ? 'lbs' : 'kg';
                const wUnit = currentUnit === 'us' ? 'lbs' : 'kg';
                const displayHeight = height > 0 ? height : '—';
                const displayCapacity = capacity > 0 ? capacity.toLocaleString() : '—';
                const displayWeight = weight > 0 ? weight.toLocaleString() : '—';
                
                return `
                    <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <div class="text-xs text-orange-500 font-semibold">${model.subcategory || 'Aerial'}</div>
                                <div class="font-bold text-xl">${model.brand} ${model.model}</div>
                            </div>
                            <div class="px-3 py-1 text-xs rounded-full ${powerType === 'Electric' ? 'bg-emerald-900 text-emerald-400' : 'bg-amber-900 text-amber-400'}">${powerType}</div>
                        </div>
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div><div class="text-xs text-slate-500">Platform Height</div><div class="text-2xl font-bold text-[#f97316]">${displayHeight}</div><div class="text-xs text-slate-500">${hUnit}</div></div>
                            <div><div class="text-xs text-slate-500">Capacity</div><div class="text-2xl font-bold text-[#f97316]">${displayCapacity}</div><div class="text-xs text-slate-500">${cUnit}</div></div>
                            <div><div class="text-xs text-slate-500">Weight</div><div class="text-2xl font-bold text-[#f97316]">${displayWeight}</div><div class="text-xs text-slate-500">${wUnit}</div></div>
                        </div>
                        <div class="mt-5 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400"><div>Click for full specs →</div></div>
                    </div>
                `;
            } else {
                const weight = model.operating_weight_lbs || specs.operating_weight_lbs || '—';
                const hp = model.engine_hp || specs.engine_hp || '—';
                const bucket = model.bucket_capacity_cy || specs.bucket_capacity_cy || '—';
                
                return `
                    <div onclick="showModelDetail(${model.id})" class="equipment-card bg-slate-900 hover:bg-slate-800 p-6 rounded-3xl cursor-pointer border border-slate-800">
                        <div class="flex justify-between">
                            <div>
                                <div class="text-sm text-slate-400">${model.year || ''} • ${model.category || ''}</div>
                                <div class="font-bold text-xl">${model.brand} ${model.model}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-slate-500">NEW</div>
                                <div class="font-semibold">$${(model.new_price_usd || 0).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="mt-6 grid grid-cols-3 gap-4 text-center text-sm">
                            <div><div class="text-[#f97316] font-bold">${weight}</div><div class="text-xs text-slate-500">lbs</div></div>
                            <div><div class="text-[#f97316] font-bold">${hp}</div><div class="text-xs text-slate-500">hp</div></div>
                            <div><div class="text-[#f97316] font-bold">${bucket}</div><div class="text-xs text-slate-500">ft / cy</div></div>
                        </div>
                    </div>
                `;
            }
        }

        function showPage(page) {
            currentPage = page;
            const container = document.getElementById('page-content');
            
            if (page === 'home') renderHome(container);
            else if (page === 'brands') renderBrands(container);
            else if (page === 'construction') renderConstruction(container);
            else if (page === 'aerial') renderAerial(container);
            else if (page === 'models') renderAllModels(container);
            else if (page === 'compare') renderCompare(container);
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="text-center py-16 hero-bg rounded-3xl mb-12">
                    <h1 class="text-6xl font-display font-bold tracking-tighter mb-4">Swipe. Compare. Decide.</h1>
                    <p class="text-2xl text-slate-400 max-w-2xl mx-auto">The definitive spec comparison platform for heavy equipment.</p>
                    <div class="mt-8 flex justify-center gap-4">
                        <button onclick="showPage('compare')" class="px-8 py-4 bg-[#f97316] text-white font-semibold rounded-3xl text-lg hover:bg-orange-600 transition-all">Start Comparing</button>
                        <button onclick="showPage('construction')" class="px-8 py-4 border border-slate-700 hover:bg-slate-800 font-semibold rounded-3xl text-lg">Browse Construction</button>
                        <button onclick="showPage('aerial')" class="px-8 py-4 border border-slate-700 hover:bg-slate-800 font-semibold rounded-3xl text-lg">Browse Aerial</button>
                    </div>
                </div>
            `;
        }

        function renderBrands(container) {
            const brands = [...new Set(equipmentDatabase.map(m => m.brand))];
            let html = `<h2 class="section-header mb-8">Equipment Brands</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            brands.forEach(brand => {
                const count = equipmentDatabase.filter(m => m.brand === brand).length;
                html += `
                    <div onclick="showBrandDetail('${brand}')" class="bg-slate-900 hover:bg-slate-800 transition-all p-8 rounded-3xl cursor-pointer border border-slate-800">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-bold text-3xl">${brand}</div>
                                <div class="text-slate-400">${count} models</div>
                            </div>
                            <i class="fa-solid fa-industry text-4xl text-[#f97316]"></i>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function showBrandDetail(brand) {
            const container = document.getElementById('page-content');
            const brandModels = equipmentDatabase.filter(m => m.brand === brand);
            let html = `
                <button onclick="showPage('brands')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Brands</button>
                <div class="flex items-center gap-4 mb-8">
                    <div class="w-16 h-16 bg-[#f97316] rounded-2xl flex items-center justify-center"><i class="fa-solid fa-industry text-4xl text-white"></i></div>
                    <div><div class="text-5xl font-bold">${brand}</div><div class="text-xl text-slate-400">${brandModels.length} models</div></div>
                </div>
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            brandModels.forEach(model => html += createModelCardHTML(model));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderConstruction(container) {
            const models = equipmentDatabase.filter(m => m.category === 'Construction');
            let html = `<h2 class="section-header mb-8">Construction Equipment</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            models.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderAerial(container) {
            const models = equipmentDatabase.filter(m => m.category === 'Aerial' || (m.subcategory && m.subcategory.includes('Scissor')));
            let html = `<h2 class="section-header mb-8">Aerial Equipment</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
            models.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderAllModels(container) {
            let html = `<h2 class="section-header mb-8">All Equipment Models</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            equipmentDatabase.forEach(m => html += createModelCardHTML(m));
            html += `</div>`;
            container.innerHTML = html;
        }

        function showModelDetail(id) {
            const model = equipmentDatabase.find(m => m.id === id);
            const container = document.getElementById('page-content');
            container.innerHTML = `
                <button onclick="showPage('models')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Models</button>
                <div class="bg-slate-900 rounded-3xl p-8">
                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="lg:w-2/3">
                            <div class="flex gap-3 mb-4">
                                <span class="px-4 py-1 bg-emerald-900 text-emerald-400 text-sm font-bold rounded-2xl">${model.year || ''} MODEL</span>
                                <span class="px-4 py-1 bg-sky-900 text-sky-400 text-sm font-bold rounded-2xl">${model.category || model.subcategory || ''}</span>
                            </div>
                            <h1 class="text-5xl font-bold">${model.brand} ${model.model}</h1>
                            <div class="text-3xl text-[#f97316] font-semibold mt-2">New: $${(model.new_price_usd || 0).toLocaleString()}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== COMPARE PAGE (NOW FULLY WORKING) ====================
        function renderCompare(container) {
            let html = `
                <h2 class="section-header mb-4">Side-by-Side Comparison</h2>
                <p class="text-slate-400 mb-6">Select up to 4 machines to compare specifications</p>
                
                <div class="bg-slate-900 p-6 rounded-3xl mb-6">
                    <div class="text-sm text-slate-400 mb-3">Select machines to compare:</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
            
            equipmentDatabase.forEach(model => {
                const isSelected = compareList.some(m => m.id === model.id);
                html += `
                    <div onclick="toggleCompare(${model.id})" class="p-3 rounded-2xl cursor-pointer text-sm flex items-center gap-2 ${isSelected ? 'bg-[#f97316] text-white' : 'bg-slate-800 hover:bg-slate-700'}">
                        <i class="fa-solid ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i>
                        <span>${model.brand} ${model.model}</span>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            // Show selected machines + Compare button
            if (compareList.length > 0) {
                html += `
                    <div class="bg-slate-900 p-6 rounded-3xl mb-6">
                        <div class="flex justify-between items-center mb-4">
                            <div class="font-semibold">Selected for comparison (${compareList.length}/4)</div>
                            <button onclick="performComparison()" class="px-8 py-3 bg-[#f97316] hover:bg-orange-600 text-white font-semibold rounded-2xl flex items-center gap-2">
                                <i class="fa-solid fa-balance-scale"></i>
                                <span>Compare Now</span>
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-3">`;
                
                compareList.forEach((model, index) => {
                    html += `
                        <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-2xl">
                            <span class="font-medium">${model.brand} ${model.model}</span>
                            <button onclick="removeFromCompare(${index})" class="text-red-400 hover:text-red-500 ml-2">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            container.innerHTML = html;
        }

        function toggleCompare(id) {
            const index = compareList.findIndex(m => m.id === id);
            if (index > -1) {
                compareList.splice(index, 1);
            } else if (compareList.length < 4) {
                compareList.push(equipmentDatabase.find(m => m.id === id));
            }
            renderCompare(document.getElementById('page-content'));
        }

        function removeFromCompare(index) {
            compareList.splice(index, 1);
            renderCompare(document.getElementById('page-content'));
        }

        function performComparison() {
            const container = document.getElementById('page-content');
            
            let html = `
                <button onclick="showPage('compare')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Back to Selection</button>
                <h2 class="section-header mb-8">Comparison Results</h2>
                <div class="overflow-x-auto">
                    <table class="w-full bg-slate-900 rounded-3xl overflow-hidden">
                        <thead>
                            <tr class="border-b border-slate-800">
                                <th class="p-4 text-left">Specification</th>`;
            
            compareList.forEach(model => {
                html += `<th class="p-4 text-center">${model.brand}<br><span class="font-normal text-sm">${model.model}</span></th>`;
            });
            
            html += `</tr></thead><tbody>`;
            
            // Rows
            const rows = [
                { label: 'Category', key: 'category' },
                { label: 'Year', key: 'year' },
                { label: 'New Price (USD)', key: 'new_price_usd', format: v => '$' + (v || 0).toLocaleString() },
            ];
            
            rows.forEach(row => {
                html += `<tr class="border-b border-slate-800">`;
                html += `<td class="p-4 font-medium">${row.label}</td>`;
                
                compareList.forEach(model => {
                    let value = model[row.key] || '—';
                    if (row.format) value = row.format(value);
                    html += `<td class="p-4 text-center">${value}</td>`;
                });
                
                html += `</tr>`;
            });
            
            html += `</tbody></table></div>`;
            
            container.innerHTML = html;
        }

        function renderCompareOld(container) {
            // This is the old placeholder version (kept for reference)
        }

        async function init() {
            await loadDataFromSupabase();
            const container = document.getElementById('page-content');
            renderHome(container);
            document.getElementById('btn-us').classList.add('bg-slate-700', 'text-white');
            console.log('%c[SwipeIron] Full working Compare page loaded', 'color:#f97316');
        }
        
        window.onload = init;
    </script>
</body>
</html>
